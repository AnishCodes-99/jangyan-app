name: Build & Release JanGyan Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/JanGyan.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JanGyan-Android-APK
          path: build/app/outputs/flutter-apk/JanGyan.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/JanGyan.apk
          name: JanGyan Release ${{ github.ref_name }}
          body: |
            ### 🇮🇳 JanGyan - Civic Literacy & Digital Citizen Empowerment Platform
            - 📚 6 Civic Domains & 60 Modular Learning Handbooks
            - 🎯 3,000 Authentic Verified Examination MCQs
            - 🤖 Built-in Gemini AI Citizen Assistant
            - 📜 Automatic Citizen Proficiency Certificates
            - ⚡ Full Offline-First Persistence + Cloud Firestore Sync
            
            **Direct Download**: Download `JanGyan.apk` below and install on any Android phone.
          draft: false
          prerelease: false
